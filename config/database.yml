# PostgreSQL. FOLKLORE_DB_SUFFIX, when set, is appended to the development and
# test database names so several checkouts on one machine use separate
# databases. Production reads DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: folklore_development<%= "_#{ENV['FOLKLORE_DB_SUFFIX']}" if ENV['FOLKLORE_DB_SUFFIX'].present? %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: folklore_test<%= "_#{ENV['FOLKLORE_DB_SUFFIX']}" if ENV['FOLKLORE_DB_SUFFIX'].present? %>

# Production reads the connection URL from DATABASE_URL, for example
# DATABASE_URL="postgres://folklore:secret@localhost/folklore_production".
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
