# PostgreSQL. Each Atelier workstream gets its own development and test
# databases when ATELIER_WORKSTREAM is set; production reads DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: folklore_development<%= "_#{ENV['ATELIER_WORKSTREAM']}" if ENV['ATELIER_WORKSTREAM'].present? %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: folklore_test<%= "_#{ENV['ATELIER_WORKSTREAM']}" if ENV['ATELIER_WORKSTREAM'].present? %>

# Production reads the connection URL from DATABASE_URL, for example
# DATABASE_URL="postgres://folklore:secret@localhost/folklore_production".
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
